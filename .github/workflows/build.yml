name: build

on:
  workflow_dispatch:
  push:
  pull_request:
  release:
    types: [created]
    
jobs:
  pymaboss_test:
    name: Testing pyMaBoSS (${{matrix.os.runs-on}}, ${{matrix.python}}, ${{matrix.maboss_install}})
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os: 
          - {runs-on: ubuntu-22.04, shell: "bash -el {0}"}
          - {runs-on: ubuntu-24.04, shell: "bash -el {0}"}
          - {runs-on: macos-15-intel, shell: "sh -l {0}"}
          - {runs-on: macos-14, shell: "sh -l {0}"}
          - {runs-on: windows-2022, shell: "pwsh"}
          - {runs-on: windows-2025, shell: "pwsh"}
        maboss_install: 
          - "experimental"
          - "conda"
        
    runs-on: ${{ matrix.os.runs-on }}
          
    defaults:
      run:
        shell: ${{ matrix.os.shell }}
          
    steps:
    - uses: actions/checkout@v7
    - if: matrix.maboss_install == 'conda'
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        channels: conda-forge
        python-version: ${{ matrix.python }}
        use-mamba: true
    - if: matrix.maboss_install == 'experimental'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        
    - name: Install MaBoSS with Conda
      if: matrix.maboss_install == 'conda'
      run: |
        conda install -c conda-forge -c colomoto 'maboss>=2.6.6' pip
        
    - name: Upgrading pip for ubuntu 22
      if: matrix.os.runs-on == 'ubuntu-22.04'
      run: 
        python -m pip install --upgrade pip
        
    - name: Install dependencies
      run: |
        python -m pip install matplotlib numpy pandas ipython --upgrade --break-system-packages
        
    - name: Install tabularqual
      if: matrix.python == '3.11' || matrix.python == '3.12' || matrix.python == '3.13' || matrix.python == '3.14'
      run: |
        python -m pip install tabularqual --upgrade --break-system-packages

    - name: Install pyMaBoSS
      run: |
        python -m pip install . --break-system-packages
        
    - name: Install MaBoSS with new script
      if: matrix.maboss_install == 'experimental'
      run: |
        python -m maboss_setup_experimental

    - name: Test pyMaBoSS for Windows
      if: matrix.os.runs-on == 'windows-2022' || matrix.os.runs-on == 'windows-2025'
      env: 
        RUN_WITH: python
      run: cmd.exe -/c ".\test\run_test.bat"
      
    - name: Test pyMaBoSS for Unix
      if: matrix.os.runs-on == 'ubuntu-22.04' || matrix.os.runs-on == 'ubuntu-24.04' || matrix.os.runs-on == 'macos-15-intel' || matrix.os.runs-on == 'macos-14'
      env: 
        RUN_WITH: python
      run: bash test/run_test.sh
    
    - name: Test pyMaBoSS with cMaBoSS for Windows
      if: matrix.os.runs-on == 'windows-2022' || matrix.os.runs-on == 'windows-2025'
      env: 
        RUN_WITH: python
      run: cmd.exe -/c ".\test\run_test_cmaboss.bat"
        
    - name: Test pyMaBoSS with cMaBoSS for Unix
      if: matrix.os.runs-on == 'ubuntu-22.04' || matrix.os.runs-on == 'ubuntu-24.04' || matrix.os.runs-on == 'macos-15-intel' || matrix.os.runs-on == 'macos-14'
      env: 
        RUN_WITH: python
      run: bash test/run_test_cmaboss.sh
    
    - name: Test MaBoSS Server with Docker
      if: matrix.os.runs-on == 'ubuntu-22.04' || matrix.os.runs-on == 'ubuntu-24.04'
      env: 
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        docker run -p 7777:7777 --network host -d sysbiocurie/maboss
        python -m unittest test.test_server
    
    - name: Test tabularqual
      if: matrix.python == '3.11' || matrix.python == '3.12' || matrix.python == '3.13' || matrix.python == '3.14'
      run: |  
        python -m unittest test.test_tabularqual
          
    # - name: Submit results to Coveralls
    #   env: 
    #     GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   run: |
    #     coveralls --service=github
        
    
  pymaboss_scripts: 
    name: Testing pyMaBoSS scripts (${{matrix.os.runs-on}}, ${{matrix.python}}, ${{matrix.maboss_install}})
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        os: 
          - {runs-on: ubuntu-22.04, shell: "bash -el {0}"}
          - {runs-on: ubuntu-24.04, shell: "bash -el {0}"}
          - {runs-on: macos-15-intel, shell: "sh -l {0}"}
          - {runs-on: macos-14, shell: "sh -l {0}"}
          - {runs-on: windows-2022, shell: "pwsh"}
          - {runs-on: windows-2025, shell: "pwsh"}
        maboss_install: 
          - "experimental"
          - "conda"
            
    runs-on: ${{ matrix.os.runs-on }}

    defaults:
      run:
        shell: ${{ matrix.os.shell }}
                
    steps:
    - uses: actions/checkout@v7
    - if: matrix.maboss_install == 'conda'
      uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        channels: conda-forge
        python-version: ${{ matrix.python }}
        use-mamba: true
    - if: matrix.maboss_install == 'experimental'
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python }}
        
    - name: Install MaBoSS with Conda
      if: matrix.maboss_install == 'conda'
      run: |
        conda install -c conda-forge -c colomoto maboss pip
        
    - name: Upgrading pip for ubuntu 22
      if: matrix.os.runs-on == 'ubuntu-22.04'
      run: 
        python -m pip install --upgrade pip
      
    - name: Install dependencies
      run: |
        python -m pip install matplotlib numpy pandas ipython --upgrade --break-system-packages

    - name: Install pyMaBoSS
      run: |
        python -m pip install . --break-system-packages
        
    - name: Install MaBoSS with new script
      if: matrix.maboss_install == 'experimental'
      run: |
        python -m maboss_setup_experimental
        
    - name: Test pyMaBoSS
      env: 
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python scripts/MBSS_FormatTable.py test/p53_Mdm2.bnd test/p53_Mdm2_runcfg.cfg
        python scripts/UpPMaBoSS.py test/CellFateModel.bnd test/CellFateModel_1h.cfg test/CellFate_1h.upp
        # coveralls --service=github
               
  conda_pymaboss:
    name: pyMaBoSS Conda package
    runs-on: ubuntu-22.04
    needs: [pymaboss_test, pymaboss_scripts]
    defaults:
      run:
        shell: bash -el {0}
    
    steps:
    - uses: actions/checkout@v7
    - uses: conda-incubator/setup-miniconda@v4
      with:
        auto-update-conda: true
        auto-activate-base: true
        channels: conda-forge
        python-version: "3.11"
        use-mamba: true
  
    - name: Install conda-build and conda-verify
      run: |
        conda install -n base -y -c conda-forge conda-build conda-verify anaconda-client
        conda build --version
        
    - name: Build pyMaBoSS Anaconda package
      run: |
        conda build -c conda-forge -c colomoto --output-folder conda-dist ./conda
        
    - name: Upload Anaconda package to colomoto's repo
      if: github.event_name == 'release' && github.event.action == 'created' && github.repository == 'colomoto/pyMaBoSS'
      run: |
        conda run -n base anaconda -t ${{ secrets.ANACONDA_TOKEN }} upload -u colomoto conda-dist/noarch/*.conda --skip-existing
        
    - name: Upload Anaconda package to vincent-noel's repo
      if: github.repository == 'vincent-noel/pyMaBoSS' && github.ref == 'refs/heads/master'
      run: |
        conda run -n base anaconda -t ${{ secrets.ANACONDA_TOKEN }} upload -u vincent-noel conda-dist/noarch/*.conda --skip-existing
      
  pypi_pymaboss:
    name: pyMaBoSS PyPi package
    runs-on: ubuntu-latest
    needs: [pymaboss_test, pymaboss_scripts]

    steps:
    - uses: actions/checkout@v7
    
    - name: Install build and twine
      run: python -m pip install build twine

    - name: Build pyMaBoSS PyPi package
      run: |
        python -m build
        python -m twine check dist/*

    - name: Upload pyMaBoSS PyPi package
      if: github.event_name == 'release' && github.event.action == 'created' && github.repository == 'colomoto/pyMaBoSS'
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        python -m twine upload --skip-existing dist/*
